name: Terraform EKS

on:
  push:
    branches:
      - infra
    paths:
        - 'Infrastructure/**'
  
  pull_request:
    branches:
      - main
      - infra
    paths:
        - 'Infrastructure/**'
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
env:
  TF_LOG: INFO
  TF_LOG_PATH: terraform.log
  TF_VERSION: 1.13.3
  TF_WORKSPACE: dev
  TF_WORKING_DIR: ./Infrastructure
  AWS_REGION: us-east-1
  

permissions:
  id-token: write
  contents: read
  pull-requests: write
  security-events: write

jobs:
#####################################
  # Stage 1: Format/Lint & Validation
#####################################
  format-validate-lint:
    runs-on: ubuntu-latest
    name: 'Format, Lint & Validation'
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v2      

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        id: init
        run: terraform init -backend=false

      - name: Terraform fmt
        id: fmt
        run: terraform fmt -check
        continue-on-error: true
     
      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color
        
     
      - name: Terraform lint
        id: tflint
        uses: terraform-linters/setup-tflint@v6
        with:
          version: latest
          cache: true
          
      - name: show tflint version
        id: tflint-version
        run: tflint --version

      - name: Initialize TFLint (install plugins)
        id: tflint-init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}
      
      - name: Run TFLint
        id: tflint-run
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: tflint --format compact
        continue-on-error: true
      
      - name: Upload TFLint Report
        uses: actions/upload-artifact@v4 
        with:
          name: tflint-report-${{ github.sha }}  
          path: ${{ env.TF_WORKING_DIR }}/tflint-report.json  
          if-no-files-found: warn
  
      - name: Cache TFLint plugins
        uses: actions/cache@v4
        with:
          path: ~/.tflint.d/plugins
          key: ${{ runner.os }}-tflint-${{ hashFiles('infrastructure/.tflint.hcl') }}
          restore-keys: |
            ${{ runner.os }}-tflint-
